<main>
    <section id="registro">
            <h3 style="text-align: center; font-size: 35px;">⚡Registro de usuario</h3> 
            <form action="" method="post">
                <label for="">Documento</label>
                <input type="text" name="documento" id="" required placeholder="Ingrese aqui su documento">
                <br></br>
                <label for="">Nombre Completo</label>
                <input type="text" name="Nombre Completo" id="" required placeholder="Ingrese aqui su nombre">
                <br></br>
                <label for="correo">Correo Electronico</label>
                <input type="email" name="correo" id="" required>
                <br></br>
                <label for="fechaNac">Fecha Nac.</label>
                <input type="date" name="fechaNac" id="" required>
                <br></br>
                <label for="genero">Genero</label>
                <input type="radio" name="genero" id="" value="Masculino">Masculino
                <input type="radio" name="genero" id="" value="Femenino">Femenino
                <input type="radio" name="genero" id="" value="Otro">Otro
                <br><br>
                <label for="nacionalidad">Nacionalidad</label>
                <select name="" id=""> <!--select>option+5-->
                    <option value="">Seleccione</option>
                    <option value="colombia">Colombia</option>
                    <option value="chile">Chile</option>
                    <option value="bolivia">Bolivia</option>
                    <option value="francia">Francia</option>
                </select>
                <br><br>
                <input type="checkbox" name="condiciones" id="">Acepto terminos y condicones.
                <hr>
                <button type="submit" name="enviar">ENVIAR</button>
                <button type="reset">Limpiar</button>
            </form>
        </section>
    
</main>
